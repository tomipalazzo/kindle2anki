[project]
name = "kindle2anki"
version = "0.1.0"
description = "A tool to convert Kindle highlights to Anki flashcards"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindle2anki"]
