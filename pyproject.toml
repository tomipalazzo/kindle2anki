[project]
name = "kindle2anki"
version = "0.1.0"
description = "A tool to convert Kindle highlights to Anki flashcards"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24.4",
    "openai>=1.0.0",
    "genanki>=0.13.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kindle2anki"]
